[supervisord]
nodaemon=true

[program:nginx]
directory=/workspace
command=tritonserver --model-repository=/workspace/model_repo_whisper
autostart=true
autorestart=true
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:flask_app]
directory=/workspace
command=fastapi run --port 8080
autostart=true
autorestart=true
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0